name: Custom release APK

on:
  push:
    tags:
      - 'v1.1.0-custom.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create from this commit
        required: true
        default: v1.1.0-custom.1

permissions:
  contents: read

jobs:
  release:
    name: Build and release signed phone arm64 APK
    runs-on: ubuntu-24.04
    env:
      TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run episode navigation unit tests
        run: ./gradlew :modes:film:testDebugUnitTest

      - name: Check Kotlin formatting
        run: ./gradlew ktfmtCheck

      - name: Validate custom release tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            case "$GITHUB_REF" in
              refs/heads/main|refs/heads/feature/episode-navigation) ;;
              *) echo "Dispatch from main or feature/episode-navigation only" >&2; exit 1 ;;
            esac
          fi
          case "$TAG_NAME" in
            v1.1.0-custom.*) ;;
            *) echo "Unsupported custom release tag: $TAG_NAME" >&2; exit 1 ;;
          esac

      - name: Decode private release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FINDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing FINDROID_RELEASE_KEYSTORE_BASE64" >&2; exit 1; }
          umask 077
          keystore="$RUNNER_TEMP/findroid-custom-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          echo "FINDROID_RELEASE_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Build signed custom release APK
        env:
          STORE_PASSWORD: ${{ secrets.FINDROID_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.FINDROID_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FINDROID_RELEASE_KEY_ALIAS }}
        run: |
          test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          ./gradlew :app:phone:assembleLibreRelease \
            "-PcustomRelease=true" \
            "-PcustomVersionCode=${GITHUB_RUN_NUMBER}" \
            "-PprereleaseVersionName=${TAG_NAME#v}" \
            "-Pandroid.injected.signing.store.file=$FINDROID_RELEASE_KEYSTORE" \
            "-Pandroid.injected.signing.store.password=$STORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"

      - name: Prepare release asset
        id: asset
        run: |
          apk="app/phone/build/outputs/apk/libre/release/phone-libre-arm64-v8a-release.apk"
          test -f "$apk"
          asset="Findroid-${TAG_NAME#v}-custom-libre-arm64-v8a.apk"
          cp "$apk" "$asset"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_path=$asset" >> "$GITHUB_OUTPUT"

      - name: Create custom release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<'EOF'
          Custom Findroid release containing the episode navigation changes.

          This is a signed release build for this fork, with minification and resource shrinking enabled. Its application ID has the .custom suffix, so it installs alongside the official app and the existing debug build. Repeated builds signed with the same private release key can update the same installation.
          EOF
          gh release create "${{ steps.asset.outputs.tag_name }}" \
            "${{ steps.asset.outputs.asset_path }}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Findroid ${{ steps.asset.outputs.tag_name }} (custom release)" \
            --notes-file release-notes.md

      - name: Remove private keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/findroid-custom-release.p12"
