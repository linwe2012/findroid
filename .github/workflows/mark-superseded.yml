name: Mark incorrect preview as superseded

on:
  push:
    branches:
      - release-maintenance/supersede-preview-cc930036

permissions:
  contents: read

jobs:
  supersede:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      OLD_TAG: preview-cc930036
      OLD_SOURCE_SHA: cc9300362c81a9958478a39bd8f3b816176ae981
      NEW_TAG: v1.1.0-episode-navigation.6
      NEW_APK: Findroid-1.1.0-episode-navigation.6-release-libre-arm64-v8a.apk
      OLD_TITLE: Findroid Custom — compact input and episode range jumps
      SUPERSEDED_TITLE: Superseded — Findroid Custom preview (different package/signature)
    steps:
      - uses: actions/checkout@v7

      - name: Confirm corrected release is published
        run: |
          gh api "repos/$REPOSITORY/releases/tags/$NEW_TAG" > /tmp/new-release.json
          jq -e --arg tag "$NEW_TAG" --arg apk "$NEW_APK" '
            .tag_name == $tag and
            .draft == false and
            .prerelease == true and
            any(.assets[]?; .name == $apk)
          ' /tmp/new-release.json >/dev/null || {
            echo "Corrected release is not published with its expected APK asset; leaving the old release untouched." >&2
            exit 1
          }

      - name: Verify and mark only the incorrect preview
        run: |
          gh api "repos/$REPOSITORY/git/ref/tags/$OLD_TAG" > /tmp/old-tag.json
          actual=$(jq -r '.object.sha' /tmp/old-tag.json)
          object_type=$(jq -r '.object.type' /tmp/old-tag.json)
          while [ "$object_type" = tag ]; do
            gh api "repos/$REPOSITORY/git/tags/$actual" > /tmp/old-tag-object.json
            actual=$(jq -r '.object.sha' /tmp/old-tag-object.json)
            object_type=$(jq -r '.object.type' /tmp/old-tag-object.json)
          done
          test "$actual" = "$OLD_SOURCE_SHA" || {
            echo "Old tag points to unexpected source $actual; refusing to edit the release." >&2
            exit 1
          }

          gh api "repos/$REPOSITORY/releases/tags/$OLD_TAG" > /tmp/old-release.json
          jq -e --arg tag "$OLD_TAG" --arg old "$OLD_TITLE" --arg superseded "$SUPERSEDED_TITLE" '
            .tag_name == $tag and
            .draft == false and
            .prerelease == true and
            (.name == $old or .name == $superseded)
          ' /tmp/old-release.json >/dev/null || {
            echo "Old release identity or visibility is unexpected; refusing to edit it." >&2
            exit 1
          }

          gh release edit "$OLD_TAG" --repo "$REPOSITORY" \
            --title "$SUPERSEDED_TITLE" \
            --notes-file old-release-notes.md \
            --prerelease

          gh api "repos/$REPOSITORY/releases/tags/$OLD_TAG" > /tmp/updated-old-release.json
          jq -e --arg tag "$OLD_TAG" --arg title "$SUPERSEDED_TITLE" --arg url "https://github.com/$REPOSITORY/releases/tag/$NEW_TAG" '
            .tag_name == $tag and
            .name == $title and
            .draft == false and
            .prerelease == true and
            (.body | contains($url))
          ' /tmp/updated-old-release.json >/dev/null

